[build-system]
requires = ["scikit-build-core>=0.5.0", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "win-sandbox"
version = "1.0.0"
description = "Windows process sandbox: WRITE_RESTRICTED token + capability-SID write allowlist + Job resource limits"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "License" }
authors = [{ name = "ming-14" }]
keywords = ["sandbox", "windows", "acl", "job", "nanobind"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.urls]
Homepage = "https://github.com/ming-14/PTY-Agent"

[tool.scikit-build]
# CMake 源目录是 src/（CMakeLists.txt 所在处）
cmake.source-dir = "src"
cmake.build-type = "Release"
# 产物安装路径完全由 CMakeLists.txt 的 install() 规则决定
# （.pyd → win_sandbox/_native/，py 包装 → win_sandbox/）
# 禁用自动包发现，避免与 CMake 安装规则重复
wheel.packages = []
# Stable ABI：abi3 下限 cp312。nanobind 3.x 链接模式（NB_STATIC）的后端库固定按
# Py_LIMITED_API=3.12 编译，低于 cp312 只能改 split mode（运行时依赖 nanobind-backend）。
# 构建机也必须是 3.12+：用 3.11 构建不会报错，但会静默退化成 cp311 版本专属 wheel。
wheel.py-api = "cp312"
